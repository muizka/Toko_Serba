<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Serba 5K</title>
    <!-- Tailwind CSS CDN Stabil -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .product-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-32 min-h-screen flex flex-col">

    <header class="bg-blue-600 text-white text-center py-8 px-4 shadow-md">
        <h1 class="text-3xl font-bold tracking-wide">📦 TOKO SERBA 5.000</h1>
        <p class="text-sm mt-2 opacity-90">Semua Produk Rp 5.000, Ada yang Diskon Juga! Tanpa Ribet, Langsung Pilih & Pesan.</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-6 flex-grow w-full">
        <div class="flex gap-2 overflow-x-auto pb-3 mb-6" id="category-filters"></div>
        <div id="product-container" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </main>

    <!-- FOOTER DENGAN TERIMPA LAYER LEBIH TINGGI & TOUCH TARGET DIPERBESAR -->
    <footer class="text-center text-gray-400 text-xs mt-12 py-8 border-t border-gray-200 bg-white relative z-30">
        <p>&copy; 2026 Toko Serba 5K. All Rights Reserved.</p>
        <div class="mt-4">
            <button id="btn-mode-admin" type="button" onclick="bukaLoginAdmin(event)" class="inline-block bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 px-5 py-2.5 rounded-lg font-bold text-xs cursor-pointer active:scale-95 transition shadow-sm">
                🔒 Masuk Mode Admin
            </button>
        </div>
    </footer>

    <!-- POPUP DETAIL PRODUK -->
    <div id="modal-detail" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl w-full max-w-sm shadow-xl overflow-hidden max-h-[85vh] overflow-y-auto">
            <img id="d-foto" src="" class="w-full aspect-square object-cover">
            <div class="p-4">
                <span id="d-kategori" class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold"></span>
                <h2 id="d-nama" class="font-bold text-lg text-gray-800 mt-1"></h2>
                <p id="d-deskripsi" class="text-sm text-gray-600 mt-2 whitespace-pre-line"></p>
                <div id="d-harga" class="mt-3"></div>
                <div class="flex gap-2 mt-4">
                    <button type="button" onclick="tutupModal('modal-detail')" class="flex-1 bg-gray-200 px-4 py-2 rounded text-sm cursor-pointer">Tutup</button>
                    <button type="button" id="d-beli-btn" class="flex-1 bg-green-500 hover:bg-green-600 text-white text-sm font-bold py-2 rounded-lg cursor-pointer">🛒 Beli Sekarang</button>
                </div>
            </div>
        </div>
    </div>

    <!-- POPUP LOGIN ADMIN -->
    <div id="modal-admin-login" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <form onsubmit="verifikasiAdmin(event)" class="bg-white rounded-xl p-6 w-full max-w-sm shadow-xl">
            <h3 class="text-lg font-bold mb-4">Masuk Mode Admin</h3>
            <input type="password" id="admin-password" placeholder="Masukkan Password Admin" class="w-full border p-2 rounded mb-4 focus:outline-blue-600 text-sm">
            <div class="flex justify-end gap-2">
                <button type="button" onclick="tutupModal('modal-admin-login')" class="bg-gray-200 px-4 py-2 rounded text-sm cursor-pointer">Batal</button>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold cursor-pointer">Masuk</button>
            </div>
        </form>
    </div>

    <!-- PANEL ADMIN FLOATING -->
    <div id="panel-admin" class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_20px_rgba(0,0,0,0.15)] border-t-4 border-yellow-400 p-4 hidden z-40 max-h-[80vh] overflow-y-auto">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-3 border-b pb-2">
                <h3 class="text-base font-bold text-blue-600">➕ Dashboard Admin (Tambah Produk)</h3>
                <button type="button" onclick="keluarAdmin()" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded cursor-pointer font-semibold">Keluar Mode Admin</button>
            </div>
            
            <form onsubmit="tambahProduk(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input type="text" id="p-nama" placeholder="Nama Produk *" required class="border p-2 rounded text-sm focus:outline-blue-600">
                <input type="text" id="p-kategori" placeholder="Kategori (Contoh: Makanan)" class="border p-2 rounded text-sm focus:outline-blue-600">
                <input type="url" id="p-foto" placeholder="Link Foto (https://...)" class="border p-2 rounded text-sm sm:col-span-2 focus:outline-blue-600">
                <textarea id="p-deskripsi" placeholder="Deskripsi produk (opsional)" class="border p-2 rounded text-sm sm:col-span-2 focus:outline-blue-600" rows="2"></textarea>
                <input type="number" id="p-diskon" placeholder="Harga Diskon (Opsional, < 5000)" class="border p-2 rounded text-sm sm:col-span-2 focus:outline-blue-600" min="0" max="4999" step="500">
                
                <div class="sm:col-span-2 flex justify-between items-center mt-2">
                    <span class="text-[11px] text-green-600">✅ Tersimpan langsung ke Supabase</span>
                    <button type="submit" id="btn-simpan" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded text-sm font-semibold cursor-pointer">Simpan Produk</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const PASSWORD_ADMIN = "admin5k";
        const HARGA_NORMAL = 5000;
        const NOMOR_WA = "6281234567890";

        const SUPABASE_URL = "https://kfapxeuayyahplmutjrb.supabase.co";
        const SUPABASE_KEY = "sb_publishable_QabEMXUJWqWPDpq7jD2PIg_U1u5Y0jX";

        let supabase = null;
        let supabaseGagalDimuat = false;
        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else {
                supabaseGagalDimuat = true;
            }
        } catch (e) {
            console.error('Gagal inisialisasi Supabase:', e);
            supabaseGagalDimuat = true;
        }

        let daftarProduk = [];
        let modeAdminAktif = false;
        let kategoriSekarang = "Semua";
        let dataSudahDimuat = false;

        async function muatDariStorage() {
            if (supabaseGagalDimuat || !supabase) {
                const container = document.getElementById('product-container');
                container.innerHTML = `<p class="col-span-full text-center text-red-500 py-8 px-4">⚠️ Gagal memuat koneksi database. Coba refresh halaman.</p>`;
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('Produk')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) {
                    console.error(error);
                    daftarProduk = [];
                } else {
                    daftarProduk = data;
                }
            } catch (e) {
                console.error('Gagal memuat produk:', e);
                daftarProduk = [];
            }
            dataSudahDimuat = true;
            renderProduk();
        }

        function hargaAktif(produk) {
            return (produk.diskon && produk.diskon < HARGA_NORMAL) ? produk.diskon : HARGA_NORMAL;
        }

        function renderProduk() {
            const container = document.getElementById('product-container');
            container.innerHTML = '';

            if (!dataSudahDimuat) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-400 py-8">Memuat produk...</p>`;
                return;
            }

            const produkDifilter = kategoriSekarang === "Semua"
                ? daftarProduk
                : daftarProduk.filter(p => p.kategori && p.kategori.toLowerCase() === kategoriSekarang.toLowerCase());

            if (produkDifilter.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-400 py-8">Belum ada produk di kategori ini.</p>`;
                renderFilterKategori();
                return;
            }

            produkDifilter.forEach(produk => {
                const card = document.createElement('div');
                card.className = "product-card bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between cursor-pointer relative";
                card.onclick = (e) => {
                    if (e.target.closest('.hapus-btn') || e.target.closest('.beli-btn')) return;
                    bukaDetail(produk.id);
                };

                const tombolHapusAdmin = modeAdminAktif
                    ? `<button type="button" onclick="event.stopPropagation(); hapusProduk(${produk.id}, '${produk.nama.replace(/'/g, "\\'")}')" class="hapus-btn absolute top-2 right-2 bg-red-600 hover:bg-red-700 text-white text-xs px-2 py-1 rounded shadow cursor-pointer font-bold z-10">✕ Hapus</button>`
                    : '';

                const harga = hargaAktif(produk);
                const adaDiskon = harga < HARGA_NORMAL;

                card.innerHTML = `
                    <div class="relative bg-gray-100 aspect-square w-full">
                        <img src="${produk.foto || 'https://placehold.co/300'}" alt="${produk.nama}" class="w-full h-full object-cover">
                        ${tombolHapusAdmin}
                    </div>
                    <div class="p-3 flex flex-col flex-grow justify-between">
                        <div>
                            <span class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold">${produk.kategori || 'Umum'}</span>
                            <h2 class="font-bold text-sm text-gray-800 line-clamp-2 mt-0.5">${produk.nama}</h2>
                        </div>
                        <div class="mt-3">
                            ${adaDiskon
                                ? `<div class="flex items-center gap-2">
                                     <p class="text-gray-400 line-through text-xs">Rp ${HARGA_NORMAL.toLocaleString('id-ID')}</p>
                                     <span class="bg-yellow-400 text-gray-900 text-[10px] font-bold px-1.5 py-0.5 rounded">DISKON</span>
                                   </div>
                                   <p class="text-blue-600 font-black text-base">Rp ${harga.toLocaleString('id-ID')}</p>`
                                : `<p class="text-blue-600 font-black text-base">Rp ${HARGA_NORMAL.toLocaleString('id-ID')}</p>`
                            }
                            <button type="button" onclick="event.stopPropagation(); pesanPencet('${produk.nama.replace(/'/g, "\\'")}', ${harga})" class="beli-btn w-full mt-2 bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-2 rounded-lg transition shadow-sm cursor-pointer">
                                🛒 Beli Sekarang
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            renderFilterKategori();
        }

        function renderFilterKategori() {
            const filterContainer = document.getElementById('category-filters');
            const semuaKategori = ['Semua', ...new Set(daftarProduk.map(p => p.kategori || 'Umum'))];
            filterContainer.innerHTML = '';
            semuaKategori.forEach(kat => {
                const aktif = kat.toLowerCase() === kategoriSekarang.toLowerCase();
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => filterKategori(kat);
                btn.className = `px-4 py-1.5 rounded-full text-xs font-semibold shadow-sm shrink-0 cursor-pointer transition ${aktif ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'}`;
                btn.innerText = kat;
                filterContainer.appendChild(btn);
            });
        }

        function filterKategori(kategori) {
            kategoriSekarang = kategori;
            renderProduk();
        }

        function bukaDetail(id) {
            const produk = daftarProduk.find(p => p.id === id);
            if (!produk) return;
            const harga = hargaAktif(produk);
            const adaDiskon = harga < HARGA_NORMAL;

            document.getElementById('d-foto').src = produk.foto || 'https://placehold.co/300';
            document.getElementById('d-kategori').innerText = produk.kategori || 'Umum';
            document.getElementById('d-nama').innerText = produk.nama;
            document.getElementById('d-deskripsi').innerText = produk.deskripsi || 'Belum ada deskripsi untuk produk ini.';
            document.getElementById('d-harga').innerHTML = adaDiskon
                ? `<div class="flex items-center gap-2">
                     <p class="text-gray-400 line-through text-xs">Rp ${HARGA_NORMAL.toLocaleString('id-ID')}</p>
                     <span class="bg-yellow-400 text-gray-900 text-[10px] font-bold px-1.5 py-0.5 rounded">DISKON</span>
                   </div>
                   <p class="text-blue-600 font-black text-xl">Rp ${harga.toLocaleString('id-ID')}</p>`
                : `<p class="text-blue-600 font-black text-xl">Rp ${HARGA_NORMAL.toLocaleString('id-ID')}</p>`;
            document.getElementById('d-beli-btn').onclick = () => pesanPencet(produk.nama, harga);

            document.getElementById('modal-detail').classList.remove('hidden');
            document.getElementById('modal-detail').classList.add('flex');
        }

        function pesanPencet(namaProduk, harga) {
            const pesan = `Halo kak, saya mau beli produk: *${namaProduk}* (Harga Rp ${harga.toLocaleString('id-ID')}). Apakah ready?`;
            const linkWA = `https://api.whatsapp.com/send?phone=${NOMOR_WA}&text=${encodeURIComponent(pesan)}`;
            window.open(linkWA, '_blank');
        }

        // FUNGSI UTAMA DIPERBAIKI UNTUK EVENT HANDLER SENSITIF
        function bukaLoginAdmin(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            const modal = document.getElementById('modal-admin-login');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('admin-password').value = '';
            setTimeout(() => {
                const input = document.getElementById('admin-password');
                if (input) input.focus();
            }, 100);
        }

        function tutupModal(id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function verifikasiAdmin(e) {
            if (e) e.preventDefault();
            const inputPass = document.getElementById('admin-password').value;
            if (inputPass === PASSWORD_ADMIN) {
                modeAdminAktif = true;
                tutupModal('modal-admin-login');
                document.getElementById('panel-admin').classList.remove('hidden');
                renderProduk();
            } else {
                alert("Password Admin Salah!");
            }
        }

        function keluarAdmin() {
            modeAdminAktif = false;
            document.getElementById('panel-admin').classList.add('hidden');
            renderProduk();
        }

        async function tambahProduk(e) {
            if (e) e.preventDefault();

            if (supabaseGagalDimuat || !supabase) {
                alert("Koneksi ke database gagal. Coba refresh halaman.");
                return;
            }

            const btnSimpan = document.getElementById('btn-simpan');
            const nama = document.getElementById('p-nama').value.trim();
            const kategori = document.getElementById('p-kategori').value.trim() || 'Umum';
            const foto = document.getElementById('p-foto').value.trim();
            const deskripsi = document.getElementById('p-deskripsi').value.trim();
            const diskonInput = document.getElementById('p-diskon').value.trim();
            const diskon = diskonInput ? Number(diskonInput) : null;

            if (!nama) { alert("Nama produk wajib diisi!"); return; }
            if (diskon !== null && (isNaN(diskon) || diskon <= 0 || diskon >= HARGA_NORMAL)) {
                alert(`Harga diskon harus lebih besar dari 0 dan lebih kecil dari Rp ${HARGA_NORMAL.toLocaleString('id-ID')}.`);
                return;
            }

            try {
                btnSimpan.innerText = "Menyimpan...";
                btnSimpan.disabled = true;

                const { error } = await supabase
                    .from('Produk')
                    .insert([{ nama, kategori, foto, deskripsi, diskon }]);

                if (error) {
                    console.error(error);
                    alert("Gagal menyimpan produk: " + error.message);
                    return;
                }

                document.getElementById('p-nama').value = '';
                document.getElementById('p-kategori').value = '';
                document.getElementById('p-foto').value = '';
                document.getElementById('p-deskripsi').value = '';
                document.getElementById('p-diskon').value = '';

                await muatDariStorage();
            } catch (e) {
                console.error(e);
                alert("Gagal menyimpan produk. Periksa koneksi internet kamu.");
            } finally {
                btnSimpan.innerText = "Simpan Produk";
                btnSimpan.disabled = false;
            }
        }

        async function hapusProduk(id, namaProduk) {
            if (!confirm(`Apakah Anda yakin ingin menghapus produk "${namaProduk}"?`)) {
                return;
            }

            if (supabaseGagalDimuat || !supabase) {
                alert("Koneksi ke database gagal. Coba refresh halaman.");
                return;
            }

            try {
                const { error } = await supabase
                    .from('Produk')
                    .delete()
                    .eq('id', id);

                if (error) {
                    console.error(error);
                    alert("Gagal menghapus produk: " + error.message);
                    return;
                }
            } catch (e) {
                console.error(e);
                alert("Gagal menghapus produk. Periksa koneksi internet kamu.");
            }

            await muatDariStorage();
        }

        // Pasang Event Listener Cadangan saat DOM Siap
        document.addEventListener('DOMContentLoaded', () => {
            const btnAdmin = document.getElementById('btn-mode-admin');
            if (btnAdmin) {
                btnAdmin.addEventListener('click', bukaLoginAdmin);
            }
        });

        muatDariStorage();
    </script>
</body>
</html>
